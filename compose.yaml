name: knowledge-platform

services:
  knowledge:
    build:
      context: .
      args:
        EMBED_MODEL: "${KNOWLEDGE_SEMANTIC_BUILD:-0}"  # 1 bakes the e5-small model into the image
    image: knowledge-platform:latest
    container_name: knowledge-mcp
    restart: unless-stopped
    ports:
      # The tailnet address of this machine; loopback until you set it, so a machine without
      # tailscale up still starts.
      - "${KNOWLEDGE_BIND:-127.0.0.1}:${KNOWLEDGE_PORT:-7234}:7234"
    volumes:
      # Read-only: the server cannot change the vault even by mistake.
      - "${KNOWLEDGE_VAULT_PATH:-${HOME}/KnowledgeBase}:/vault:ro"
      - knowledge-data:/data
    environment:
      KNOWLEDGE_INCLUDE: "${KNOWLEDGE_INCLUDE-01 Архив}"
      # on = hybrid BM25 + vectors (needs the image built with KNOWLEDGE_SEMANTIC_BUILD=1, ~800 MB of RAM).
      KNOWLEDGE_SEMANTIC: "${KNOWLEDGE_SEMANTIC:-off}"
      # Rollback path if clients lose access: KNOWLEDGE_AUTH=off docker compose up -d (the port stays tailnet-only).
      KNOWLEDGE_AUTH: "${KNOWLEDGE_AUTH:-on}"
      KNOWLEDGE_GITHUB_REPO: "${KNOWLEDGE_GITHUB_REPO:-CosmDandy/knowledge}"
      # Empty keeps the write tools off. Supply it from sops: sops exec-env secrets.sops.yaml 'docker compose up -d'
      KNOWLEDGE_GITHUB_TOKEN: "${KNOWLEDGE_GITHUB_TOKEN:-}"
    # The MCP bearer token, from sops (KNOWLEDGE_MCP_TOKEN): mounted as /run/secrets/knowledge_token,
    # not as an env var, so `docker inspect` does not show it.
    secrets:
      - knowledge_token
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 7234), 2)"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  knowledge_token:
    environment: KNOWLEDGE_MCP_TOKEN

volumes:
  knowledge-data:
