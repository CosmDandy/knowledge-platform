[project]
name = "knowledge"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    # NOTE: the major is explicit because 2.x renamed FastMCP to MCPServer.
    "mcp>=2",
    # ONNX runtime embeddings without torch; add_custom_model (used for multilingual-e5-small) needs 0.7+.
    "fastembed>=0.7",
    "numpy>=2",
]

[project.scripts]
knowledge = "knowledge.__main__:main"
knowledge-mcp = "knowledge.server:main"
knowledge-mcp-http = "knowledge.server:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge"]

[tool.ruff]
line-length = 120
